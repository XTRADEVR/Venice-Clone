<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venice Clone</title>
<style>
  body { background:#111; color:#fff; font-family:sans-serif; margin:0; }
  header { display:flex; justify-content:space-between; padding:14px; background:#1a1a1a; }
  #chat { padding:16px; height:70vh; overflow:auto; }
  .msg { margin:10px 0; padding:10px; border-radius:10px; max-width:85%; }
  .user { background:#2563eb; margin-left:auto; }
  .ai { background:#222; }
  #box { display:flex; padding:12px; gap:8px; background:#1a1a1a; position:fixed; bottom:0; left:0; right:0; }
  input, select { flex:1; padding:12px; border-radius:10px; border:none; background:#222; color:#fff; }
  button { padding:12px 16px; border-radius:10px; border:none; background:#2563eb; color:#fff; font-weight:bold; }
  #settings { display:none; padding:16px; background:#1a1a1a; }
  #settings input { width:100%; margin:8px 0; }
</style>
</head>
<body>
<header>
  <b>Venice Clone</b>
  <button onclick="toggleSettings()">Setelan</button>
</header>

<div id="settings">
  <h3>Setelan Venice API</h3>
  <label>Venice API Key (dari venice.ai/settings/api)</label>
  <input id="apiKey" type="password" placeholder="Tempel sk-xxxx di sini...">
  <label>Model</label>
  <select id="model">
    <option value="venice-uncensored">venice-uncensored</option>
    <option value="llama-3.3-70b">llama-3.3-70b</option>
    <option value="venice-llama-3.3-70b">venice-llama-3.3-70b</option>
  </select>
  <button onclick="saveKey()">Simpan Key</button>
  <p id="status" style="font-size:13px; color:#aaa;">Belum ada key tersimpan.</p>
  <p style="font-size:12px; color:#888;">Key cuma disimpan di HP lu (localStorage), tidak di-upload ke Github.</p>
</div>

<div id="chat"><div class="msg ai">Halo king, tempel API Key lu di Setelan dulu, baru chat jalan. Kalo belum ada key, masih Mode Lokal.</div></div>

<div id="box">
  <input id="input" placeholder="Tulis pesan...">
  <button onclick="send()">Kirim</button>
</div>

<script>
let apiKey = localStorage.getItem('venice_key') || '';
let model = localStorage.getItem('venice_model') || 'venice-uncensored';
if(apiKey){ document.getElementById('status').innerText = 'Key tersimpan ✓ Model: ' + model; document.getElementById('apiKey').value = apiKey; }
document.getElementById('model').value = model;

function toggleSettings(){
  let s = document.getElementById('settings');
  s.style.display = s.style.display === 'block' ? 'none' : 'block';
}
function saveKey(){
  apiKey = document.getElementById('apiKey').value.trim();
  model = document.getElementById('model').value;
  localStorage.setItem('venice_key', apiKey);
  localStorage.setItem('venice_model', model);
  document.getElementById('status').innerText = 'Key tersimpan ✓ Model: ' + model;
  alert('Key tersimpan!');
  toggleSettings();
}
async function send(){
  let inp = document.getElementById('input');
  let text = inp.value.trim();
  if(!text) return;
  let chat = document.getElementById('chat');
  chat.innerHTML += `<div class="msg user">${text}</div>`;
  inp.value = '';
  if(!apiKey){
    chat.innerHTML += `<div class="msg ai">Mode lokal. Tempel API Key dulu di Setelan.</div>`;
    return;
  }
  chat.innerHTML += `<div class="msg ai" id="loading">Mengetik...</div>`;
  try{
    let res = await fetch('https://api.venice.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: model, messages: [{ role: 'user', content: text }] })
    });
    let data = await res.json();
    document.getElementById('loading').remove();
    let reply = data.choices?.[0]?.message?.content || 'Error: ' + JSON.stringify(data).slice(0,300);
    chat.innerHTML += `<div class="msg ai">${reply}</div>`;
  } catch(e){
    document.getElementById('loading').remove();
    chat.innerHTML += `<div class="msg ai">Gagal nyambung ke Venice. Coba aktifin WARP / VPN, terus refresh.</div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
